name: release-images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
      - name: CouchDB image metadata
        id: couch-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-couchdb
          tags: |
            type=ref,event=tag
            type=sha
      - name: Build and publish CouchDB + Prolog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/couchdb/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.couch-meta.outputs.tags }}
          labels: ${{ steps.couch-meta.outputs.labels }}
