name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: swipl:10.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Run Prolog tests
        run: cd tests && swipl -q -s run.pl --

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t prolog-query-server:test .
      - name: Build CouchDB image with Prolog query server
        run: docker build -f docker/couchdb/Dockerfile -t couchdb-prolog:test .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CouchDB + expert-system smoke test
        run: tests/integration.sh
