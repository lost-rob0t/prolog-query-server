services:
  couchdb:
    build:
      context: .
      dockerfile: docker/couchdb/Dockerfile
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 2s
      timeout: 2s
      retries: 30

  prolog-query-server:
    build: .
    environment:
      PORT: 8080
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_DATABASE: prolog_kb
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
      PQS_AUTH_MODE: ${PQS_AUTH_MODE:-off}
      PQS_READ_TOKEN: ${PQS_READ_TOKEN:-}
      PQS_WRITE_TOKEN: ${PQS_WRITE_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb-data:
