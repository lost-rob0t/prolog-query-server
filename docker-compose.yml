services:
  couchdb:
    build:
      context: .
      dockerfile: docker/couchdb/Dockerfile
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5984/_up"]
      interval: 2s
      timeout: 2s
      retries: 30

  prolog-query-server:
    build: .
    environment:
      PORT: 8080
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_DATABASE: prolog_kb
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
      PQS_AUTH_MODE: ${PQS_AUTH_MODE:-off}
      PQS_READ_TOKEN: ${PQS_READ_TOKEN:-}
      PQS_WRITE_TOKEN: ${PQS_WRITE_TOKEN:-}
      PQS_QUERY_TIMEOUT_MS: ${PQS_QUERY_TIMEOUT_MS:-5000}
      PQS_MAX_QUERY_DEPTH: ${PQS_MAX_QUERY_DEPTH:-32}
      PQS_MAX_QUERY_SOLUTIONS: ${PQS_MAX_QUERY_SOLUTIONS:-100}
      PQS_MAX_INFERENCE_STEPS: ${PQS_MAX_INFERENCE_STEPS:-1000000}
      PQS_MAX_PROOF_NODES: ${PQS_MAX_PROOF_NODES:-10000}
      PQS_MAX_PROOF_BYTES: ${PQS_MAX_PROOF_BYTES:-1048576}
      PQS_MAX_KB_DOCUMENTS: ${PQS_MAX_KB_DOCUMENTS:-10000}
      PQS_MAX_KB_BYTES: ${PQS_MAX_KB_BYTES:-16777216}
      PQS_MAX_DOCUMENT_BYTES: ${PQS_MAX_DOCUMENT_BYTES:-262144}
      PQS_MAX_RULE_GOALS: ${PQS_MAX_RULE_GOALS:-256}
      PQS_MAX_REQUEST_BYTES: ${PQS_MAX_REQUEST_BYTES:-2097152}
      PQS_MAX_ACTIVE_QUERIES: ${PQS_MAX_ACTIVE_QUERIES:-8}
      PQS_QUERY_RESULT_TTL_SECONDS: ${PQS_QUERY_RESULT_TTL_SECONDS:-300}
      PQS_CHANGES_BATCH_SIZE: ${PQS_CHANGES_BATCH_SIZE:-100}
    ports:
      - "8080:8080"
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb-data:
